name: CI — Semantic Compiler, Streaming/Redshift Simulator, Pytest & CDK Synth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Semantic Layer Parity, Local Lakehouse Simulator, Pytest & CDK Synth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20 (for AWS CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install local AWS CDK CLI
        run: npm install --no-audit --no-fund

      - name: Lint with Ruff
        run: ruff check .

      - name: Verify Governed Semantic Layer zero-drift compilation
        run: python src/semantic_compiler.py --check

      - name: Execute Kinesis -> S3 Parquet Lake -> Redshift Star Schema & Semantic BI Simulator
        run: |
          python scripts/generate_data.py
          DEMO_MODE=true python src/local_runner.py

      - name: Run EVM math, Semantic Compiler parity, RLS, and CDK assertion tests
        run: pytest -v

      - name: Synthesize all AWS CDK stacks offline (Kinesis + S3 + Redshift + QuickSight)
        run: npx cdk synth --app "python3 infra/app.py" --quiet
